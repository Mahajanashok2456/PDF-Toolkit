[build]
  command = "npm run build"
  publish = "build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  # Route the specific PDF-to-Word endpoint to the Python function
  from = "/api/pdf-to-word"
  to = "/.netlify/functions/pdf_to_word"
  status = 200
  force = true

[[redirects]]
  # Route all other API requests to the Node.js function
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  # SPA catch-all for frontend routing
  from = "/*"
  to = "/index.html"
  status = 200
