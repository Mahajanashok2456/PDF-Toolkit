[build]
  command = "npm run build"
  publish = "build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  # Route all API requests to the Node.js function
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  # SPA catch-all for frontend routing (must be last)
  from = "/*"
  to = "/index.html"
  status = 200
